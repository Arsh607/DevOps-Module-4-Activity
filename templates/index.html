<!DOCTYPE html>
<html>
<head>
<title>Flask Greeting App</title>
</head>

<body>

<h1>Enter Your Name</h1>

<form method="POST">

<label>Name:</label>

<input type="text" name="name">

<button type="submit">Submit</button>

</form>

{% if greeting %}
<p>{{ greeting }}</p>
{% endif %}

</body>
</html>
